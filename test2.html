<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>June 2026 Self-Fly Safari</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; padding: 40px 20px; }
        h1 { text-align: center; margin-bottom: 40px; font-weight: 300; letter-spacing: 2px; }
       
        /* Responsive Grid */
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .gallery-item { position: relative; overflow: hidden; border-radius: 8px; aspect-ratio: 1 / 1; cursor: pointer; background: #1e1e1e; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .gallery-item:hover img { transform: scale(1.05); }

        /* Lightbox Modal */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 4px; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 40px; color: #fff; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

    <h1>June 2026 Self-Fly Safari</h1>

    <div class="gallery-grid" id="grid"></div>

    <!-- Lightbox Container -->
    <div id="lightboxModal" class="lightbox">
        <span class="close-btn"><span id="num"></span> <span onclick="left_arrow()">&larr;</span> <span onclick="right_arrow()">&rarr;</span> <span onclick="closeLightbox()">&times;</span></span>
        <img id="lightboxImg" src="" alt="Enlarged view">
    </div>

    <script>
       var pics = [
         { "fn": "pics/IMG_5690_reduced.JPG" },
         { "fn": "pics/IMG_5694_reduced.JPG" },
         { "fn": "pics/IMG_5695_reduced.JPG" },
        ];
        var n = 0;
        pics.forEach(function(d, i) {
            document.getElementById('grid').innerHTML += "<div class='gallery-item' onclick='openLightbox(" + i + ")'><img src='" + d.fn + "'></div>";
        });
      
        function openLightbox(src) {
            n = src;
            document.getElementById('lightboxImg').src = pics[src].fn;
            document.getElementById('lightboxModal').style.display = 'flex';
            document.getElementById('num').innerHTML = (n + 1) + "/" + pics.length;
        }
        function closeLightbox() {
            document.getElementById('lightboxModal').style.display = 'none';
        }
        function left_arrow() {
            n = Math.max(n-1, 0);
            openLightbox(n);
        }
        function right_arrow() {
            n = Math.min(n+1, pics.length-1);
            openLightbox(n);
        }
        // Close via Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") left_arrow();
            if (e.key === "ArrowRight") right_arrow();
        });
    </script>
</body>
</html>
